<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Sentry-CD logo">
  <defs>
    <radialGradient id="orb" cx="42%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F2F2F7"/>
      <stop offset="78%" stop-color="#C7C7CC"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </radialGradient>
    <radialGradient id="alert" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6961" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FF453A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="256" cy="256" r="86" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="256" cy="256" r="128" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="256" cy="256" r="170" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M256 86 A170 170 0 0 1 403 171" stroke="#FF453A" stroke-opacity="0.9" stroke-width="6"/>
    <path d="M86 300 A170 170 0 0 1 150 120" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"/>
  </g>
  <circle cx="256" cy="256" r="78" fill="url(#alert)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="62" fill="url(#orb)"/>
  <ellipse cx="232" cy="232" rx="22" ry="14" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
